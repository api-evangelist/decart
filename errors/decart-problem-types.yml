gaps:
- No 429 / rate-limit error is declared on any operation.
- No 5xx responses are declared on any operation.
- Job failure is signalled through the job status field returned by get_job_v1_jobs__job_id__get
  rather than through an HTTP error; the published spec types that response as an
  empty schema, so failure reason codes are not machine-readable from the contract.
