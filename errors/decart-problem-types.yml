description: 'Decart''s REST error surface is the FastAPI default: a 422 Validation
  Error carrying an HTTPValidationError envelope on every operation, plus 401/403
  on client-token minting. No application/problem+json media type, no error type URIs,
  and no numbered error-code registry are published. The gRPC Oasis service is the
  richer surface: it defines an explicit ErrorCode enum returned inside a decart.inference.common.Error
  message.'
envelope:
  rest:
    media_type: application/json
    schema: HTTPValidationError
    shape:
      detail:
      - loc: array of string|integer — path to the offending field
        msg: human-readable message
        type: machine-readable error type string
        input: the rejected input value
        ctx: additional context object
  grpc:
    message: decart.inference.common.Error
    shape:
      code: ErrorCode enum value
      message: human-readable message
      details: map<string, string>
problems:
- status: 401
  title: No or invalid API key provided
  description: The x-api-key header was missing or did not match an active key.
  source_operation: openapi/decart-api-openapi-original.json#create_client_token_v1_client_tokens_post
  remediation: Create a key at https://platform.decart.ai/api-keys and send it as
    the x-api-key header.
- status: 403
  title: Cannot create client token from a client token
  description: Client-token minting was attempted using an ephemeral ek_ token rather
    than a permanent dct_ account key.
  source_operation: openapi/decart-api-openapi-original.json#create_client_token_v1_client_tokens_post
  remediation: Mint client tokens server-side with the permanent account key. Ephemeral
    tokens cannot mint further tokens.
- status: 422
  title: Validation Error
  description: Request body or parameters failed schema validation. Returned by every
    operation in both published specs (55 of 55 in the API-host spec, 20 of 20 in
    the curated spec).
  schema: HTTPValidationError
  source_operation: openapi/decart-api-openapi-original.json (all operations)
  remediation: Read detail[].loc to find the offending field and detail[].type for
    the validation rule that failed.
