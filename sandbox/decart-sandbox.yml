description: 'Decart has no test/live key separation and publishes no magic test values
  — there are no test cards, test identifiers, fixtures, or time-simulation tools,
  because generation is the product and every call renders real media against real
  GPU time. What it does publish is evaluation surface: free credits on every new
  account, an interactive Realtime Playground in the platform console, and a fully
  public in-browser demo of the Oasis 3 Preview world model that needs no account
  at all.'
