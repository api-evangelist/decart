apis:
- aid: decart:decart-realtime-api
  name: Decart Realtime API
  description: >-
    The realtime video transformation surface. A client opens a WebRTC session (LiveKit-managed transport)
    against a Lucy realtime model and streams camera or video frames in; the model returns transformed
    frames live, and the prompt or reference image can be swapped mid-session. Browser and mobile clients
    authenticate with short-lived ek_ client tokens minted server-side, optionally scoped to specific
    models, origins, and a maximum session duration.
  humanURL: https://docs.platform.decart.ai/models/realtime/overview
  baseURL: https://api.decart.ai
  tags:
  - Real-Time
  - Streaming
  - WebRTC
  - Video Editing
  tags_raw:
  - Real Time
  - Streaming
  - WebRTC
  - Video Editing
  properties:
  - type: Documentation
    url: https://docs.platform.decart.ai/models/realtime/overview
  - type: GettingStarted
    url: https://docs.platform.decart.ai/getting-started/quickstart
- aid: decart:decart-oasis-a2v
  name: Decart Oasis Action-to-Video (gRPC)
  description: >-
    A gRPC session protocol for Oasis 3 Preview, Decart's promptable real-time world model. A client initializes
    a session, sets a scene with a text prompt, then loops Infer calls that submit four driving actions
    (throttle and steering) and receive four generated camera frames, before calling Finish to release
    the session. Published as proto3 definitions inside the decart-oasis Python SDK.
  humanURL: https://docs.platform.decart.ai/models/realtime/oasis-3
  baseURL: https://api.decart.ai
  tags:
  - World Models
  - Real-Time
  - gRPC
  - Robotics
  tags_raw:
  - World Models
  - Real Time
  - gRPC
  - Robotics
  properties:
