    url: grpc/decart-a2v.proto
  - type: Protobuf
    url: grpc/decart-common.proto
  - type: Documentation
    url: https://docs.platform.decart.ai/models/realtime/oasis-3
- aid: decart:decart-docs-mcp
  name: Decart Documentation MCP Server
  description: >-
    A hosted, unauthenticated Model Context Protocol server at docs.platform.decart.ai/mcp that exposes
    the Decart API Platform documentation to agents. Three tools: full-text search across the knowledge
    base, a read-only virtual filesystem query over the docs pages and OpenAPI specs, and a documentation
    feedback submission.
  humanURL: https://docs.platform.decart.ai/
  baseURL: https://docs.platform.decart.ai/mcp
