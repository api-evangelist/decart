aid: decart
name: Decart
description: 'Decart is an AI research lab and API platform building real-time world
  models — foundation models that generate and transform video frame-by-frame as they
  are watched. Its Decart API Platform (platform.decart.ai) exposes the Lucy family
  of realtime and batch video/image models plus the Oasis promptable world model through
  three surfaces: a Realtime API that edits a live WebRTC camera or video stream with
  text prompts and reference images, a Queue API that submits asynchronous video jobs
  and polls them to completion, and a Process API for synchronous image editing. The
  platform ships first-party JavaScript, Python, Swift and Android SDKs, ephemeral
  client tokens for browser and mobile apps, a Files API for reusable reference images,
  and a gRPC action-to-video session protocol for Oasis 3 Preview. Pricing is pay-as-you-go
  and metered per generated second (video and realtime) or per generation (images).'
