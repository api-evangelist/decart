apis:
- aid: decart:decart-api
  name: Decart API
  description: 'The Decart REST API at api.decart.ai. Covers the Queue API (submit
    an asynchronous video job against a Lucy model, poll its status, download the
    rendered content), the Process API (synchronous image editing that returns image
    bytes), the Files API (upload a reference asset once, reuse it by file_* id, delete
    it before its TTL), ephemeral client-token minting for browser and mobile realtime
    sessions, realtime concurrency quota, and model-alias resolution. Authenticated
    with an x-api-key header.'
  humanURL: https://docs.platform.decart.ai/getting-started/overview
  baseURL: https://api.decart.ai
  tags:
  - Video Generation
  - Video Editing
  - Image Editing
  - Artificial Intelligence
  - Real Time
