openapi: 3.2.0
info:
  title: Decart Watch Stream API
  version: 1.0.0
tags:
- name: Watch Stream
paths:
  /watch-stream/{room_id}:
    post:
      summary: Watch Stream
      description: Issue LiveKit viewer credentials for the given room.
      operationId: watch_stream_watch_stream__room_id__post
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          title: Room Id
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          description: API key for authentication
          title: X-Api-Key
        description: API key for authentication
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchStreamResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Watch Stream
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    WatchStreamResponse:
      properties:
        livekit_url:
          type: string
          title: Livekit Url
        token:
          type: string
          title: Token
        room_name:
          type: string
          title: Room Name
      type: object
      required:
      - livekit_url
      - token
      - room_name
      title: WatchStreamResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
