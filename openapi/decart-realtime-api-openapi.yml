          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeQuotaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Realtime
